name: Update Scores

on:
  schedule:
    # Runs daily at 09:00 UTC (~5am ET). Adjust as you like.
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and compute scores
        run: python fetch_scores.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update scores $(date -u +%Y-%m-%d)"
          git push
